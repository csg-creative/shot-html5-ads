<script>
(function(){

const G = {
 "logo": {
  "ox": 70.275,

  "y": -18.862,
  "rot": 27.499
 },
 "lines": [
  {
   "id": "b1",
   "x": 15.0,
   "w": 101.976562
  },
  {
   "id": "b2",
   "x": 15.0,
   "w": 171.597656
  },
  {
   "id": "b3",
   "x": 15.0,
   "w": 203.304688
  },
  {
   "id": "a1",
   "x": 141.671875,
   "w": 138.726563
  },
  {
   "id": "a2",
   "x": 116.445312,
   "w": 163.953126
  },
  {
   "id": "a3",
   "x": 38.171875,
   "w": 242.226563
  }
 ],
 "ctaA": [
  79.480469,
  200.546875,
  211.253906,
  239.351562
 ],
 "ctaB": [
  79.390625,
  200.015625,
  211.339844,
  239.878906
 ],
 "arrowA": [
  24.996094,
  199.0,
  69.65625,
  227.59375
 ],
 "arrowB": [
  24.996094,
  199.0,
  69.65625,
  227.59375
 ],
 "photo": [
  196.601562,
  66.0,
  300.0,
  165.296875
 ]
};
const L = id => G.lines.find(l => l.id === id);
const C = bb => `${(bb[0]+bb[2])/2} ${(bb[1]+bb[3])/2}`;
const tl = gsap.timeline({paused: true});
window.tl = tl;

function inLeft(id, t){ const l=L(id);
  tl.fromTo('#r-'+id,{attr:{x:l.x,width:0}},{attr:{width:l.w},duration:.38,ease:'power3.out'},t);
  tl.from('#'+id+' > :not(:first-child)',{x:-28,duration:.5,ease:'power3.out'},t+.04); }
function outLeft(id, t){ const l=L(id);
  tl.to('#r-'+id,{attr:{width:0},duration:.3,ease:'power2.in'},t); }
function inRight(id, t){ const l=L(id);
  tl.fromTo('#r-'+id,{attr:{x:l.x+l.w,width:0}},{attr:{x:l.x,width:l.w},duration:.38,ease:'power3.out'},t);
  tl.from('#'+id+' > :not(:first-child)',{x:28,duration:.5,ease:'power3.out'},t+.04); }

// start state
['a1','a2','a3'].forEach(id=>{ gsap.set('#r-'+id,{attr:{width:0}}); });
gsap.set(['#nssf','#shadowA','#shadowB','#arrowA','#ctaB','#photo','#arrowB'],{opacity:0});
gsap.set('#date',{y:-2,opacity:0});
gsap.set('#shine',{attr:{x:G.ctaA[0]-60}});
gsap.set('#ctaB',{svgOrigin:C(G.ctaB)});
gsap.set('#ctaA',{svgOrigin:C(G.ctaA)});
gsap.set('#photo',{svgOrigin:C(G.photo)});

gsap.set(['#logo','#ctaA'],{opacity:0});
const LB = '#logoB';
// ---- message 1 (builds by ~2.3s)
tl.to(['#date','#nssf'],{opacity:1,duration:.5},0)
  .from(LB,{opacity:0,scale:.6,svgOrigin:`${G.logo.ox+G.logo.x} ${G.logo.oy+G.logo.y}`,duration:.6,ease:'back.out(1.6)'},.15)
  .to('#shadowB',{opacity:1,duration:.3},.6)
  .to('#photo',{opacity:1,duration:.5},.3);
inLeft('b1',.7); inLeft('b2',1.0); inLeft('b3',1.3);
tl.to('#ctaB',{opacity:1,duration:.4},1.7)
  .to('#arrowB',{opacity:1,duration:.4},1.9);
// ---- hold ~2.6s, then crossfade to message 2
const T = 4.9, F = .6;
tl.to(['#headB','#photo',LB,'#shadowB','#ctaB','#arrowB'],{opacity:0,duration:F,ease:'power1.inOut'},T)
  .to(['#logo','#shadowA','#ctaA','#arrowA'],{opacity:1,duration:F,ease:'power1.inOut'},T)
  .to('#date',{y:0,duration:F},T);
inRight('a1',T+.3); inRight('a2',T+.55); inRight('a3',T+.8);
tl.to('#shine',{attr:{x:G.ctaA[2]+20},duration:.8,ease:'power1.inOut'},T+1.6);

// ---- loop: 3 passes; message 2 holds ~3s before each restart; stops on the end frame
const art=document.getElementById('art'), fg=document.createElementNS('http://www.w3.org/2000/svg','g');
fg.id='fg'; Array.from(art.children).forEach(c=>{ if(c.tagName!=='defs' && c.id!=='bg') fg.appendChild(c); }); art.appendChild(fg);
const D=tl.duration(), master=gsap.timeline({paused:true});
for(let i=0;i<3;i++){
  master.set('#fg',{opacity:1}).add(tl.tweenFromTo(0,D,{ease:'none'}));
  if(i<2) master.to('#fg',{opacity:0,duration:.35,ease:'power1.in'},'+=2.1');
}
window.master=master; window.tl=master;

if(!window.__capture){ window.addEventListener('load',function(){ (window.master||tl).play(0); }); }
})();

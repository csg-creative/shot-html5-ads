<script>

 ]
};
const L = id => G.lines.find(l => l.id === id);
const C = bb => `${(bb[0]+bb[2])/2} ${(bb[1]+bb[3])/2}`;
const tl = gsap.timeline({paused: true});
window.tl = tl;
function inLeft(id, t){ const l=L(id);
  tl.fromTo('#r-'+id,{attr:{x:l.x,width:0}},{attr:{width:l.w},duration:.38,ease:'power3.out'},t);
  tl.from('#'+id+' > :not(:first-child)',{x:-28,duration:.5,ease:'power3.out'},t+.04); }
function inRight(id, t){ const l=L(id);
  tl.fromTo('#r-'+id,{attr:{x:l.x+l.w,width:0}},{attr:{x:l.x,width:l.w},duration:.38,ease:'power3.out'},t);
  tl.from('#'+id+' > :not(:first-child)',{x:28,duration:.5,ease:'power3.out'},t+.04); }
function outLeft(id, t){ tl.to('#r-'+id,{attr:{width:0},duration:.3,ease:'power2.in'},t); }
function wipeRight(sel, bb, t, d){ // reveal a hand-drawn arrow left to right
  const id='w'+sel.slice(1); const cp=document.createElementNS('http://www.w3.org/2000/svg','clipPath');
  cp.id=id; const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',bb[0]-2); r.setAttribute('y',bb[1]-2); r.setAttribute('width',0); r.setAttribute('height',bb[3]-bb[1]+4);
  cp.appendChild(r); document.querySelector('#art defs').appendChild(cp);
  document.querySelector(sel).setAttribute('clip-path',`url(#${id})`);
  tl.to(r,{attr:{width:bb[2]-bb[0]+4},duration:d||.45,ease:'power2.inOut'},t); }

['a1','a2','a3','a4'].forEach(id=>gsap.set('#r-'+id,{attr:{width:0}}));
gsap.set(['#nssf','#rule','#date','#shadowA','#shadowB','#ctaB','#photoA','#photoB1','#photoB2','#arrowB','#vest'],{opacity:0});

gsap.set('#photoA',{svgOrigin:C(G.photoA)}); gsap.set('#photoB1',{svgOrigin:C(G.photoB1)});
gsap.set('#photoB2',{svgOrigin:C(G.photoB2)}); gsap.set('#vest',{svgOrigin:C(G.vest)});

const LB='#logoB', LG=G.logo;
// ---- beat 1
tl.to(['#date','#nssf','#rule'],{opacity:1,duration:.5},0)

  .from(LB,{opacity:0,scale:.6,svgOrigin:`${LG.ox+LG.x} ${LG.oy+LG.y}`,duration:.6,ease:'back.out(1.6)'},.4)
  .to('#shadowB',{opacity:1,duration:.3},.9);
inLeft('b1',1.2); inLeft('b2',1.6); inLeft('b3',2.0);
tl.to('#photoB2',{opacity:1,duration:.5},2.4)
  .to('#arrowB',{opacity:1,duration:.4},2.7)
  .to('#ctaB',{opacity:1,duration:.4},2.9);
// ---- crossfade
const T = 5.4, F = .6;
tl.to(['#headB','#photoB1','#photoB2',LB,'#shadowB','#ctaB','#arrowB'],{opacity:0,duration:F,ease:'power1.inOut'},T)
  .to(['#logo','#shadowA','#ctaA','#photoA'],{opacity:1,duration:F,ease:'power1.inOut'},T);
inLeft('a1',T+.35); inRight('a2',T+.6); inLeft('a3',T+.85); inRight('a4',T+1.1);
tl.to(['#curl1','#curl2'],{opacity:1,duration:.4},T+1.2)
  .to('#vest',{opacity:1,duration:.4},T+1.4)
  .to('#shine',{attr:{x:G.ctaA[2]+20},duration:.8,ease:'power1.inOut'},T+2.2);

if(!window.__capture){ window.addEventListener('load',function(){ tl.play(0); }); }
